
name: collect
on:
  schedule:
    - cron: "*/15 1-3 * * 1-5"     # будни 07:00-09:45 по Бишкеку
    - cron: "*/15 11-13 * * 1-5"   # будни 17:00-19:45
    - cron: "0 22 * * *"           # каждый день 04:00, дорога свободна
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          DGIS_KEY: ${{ secrets.DGIS_KEY }}
      - name: commit data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/delays.csv
          git commit -m "data $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
