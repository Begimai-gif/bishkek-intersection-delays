
name: collect
on:
  schedule:
    - cron: "50 0 * * 1-5"
    - cron: "50 10 * * 1-5"
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: collect loop
        env:
          DGIS_KEY: ${{ secrets.DGIS_KEY }}
          DGIS_KEY_2: ${{ secrets.DGIS_KEY2 }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "50 0 * * 1-5"|"50 10 * * 1-5") N=6 ;;
            *) N=1 ;;
          esac
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 1 $N); do
            python collect.py
            git add data/delays.csv
            git commit -m "data $(date -u +%FT%TZ)" || true
            git pull --rebase -q || true
            git push || true
            if [ "$i" -lt "$N" ]; then sleep 1800; fi
          done
