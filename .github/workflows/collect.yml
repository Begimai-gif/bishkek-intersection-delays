
name: collect
on:
  schedule:
    - cron: "*/10 0-17 * * *"
    - cron: "0 18-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          DGIS_KEY: ${{ secrets.DGIS_KEY }}
      - name: commit data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/delays.csv
          git commit -m "data $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
